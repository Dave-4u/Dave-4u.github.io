<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heap &amp; Trie Playground</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="back" href="../../">← Portfolio</a>
      <h1>Heap &amp; Trie Playground</h1>
      <p class="sub">Insert into a binary min-heap or a prefix trie and inspect the live structure.</p>
    </div>
  </header>

  <main class="wrap layout">
    <section class="panel">
      <h2>Min-Heap</h2>
      <div class="row">
        <input id="heapInput" type="number" placeholder="Value" />
        <button id="heapInsert" class="primary" type="button">Insert</button>
        <button id="heapExtract" type="button">Extract-min</button>
        <button id="heapClear" type="button">Clear</button>
      </div>
      <p class="meta">Array view: <code id="heapArray">[]</code></p>
      <pre id="heapTree" class="view" aria-live="polite">(empty)</pre>
    </section>

    <section class="panel">
      <h2>Prefix Trie</h2>
      <div class="row">
        <input id="trieInput" type="text" placeholder="word" maxlength="24" />
        <button id="trieInsert" class="primary" type="button">Insert</button>
        <button id="trieSuggest" type="button">Autocomplete</button>
        <button id="trieClear" type="button">Clear</button>
      </div>
      <p class="meta">Suggestions: <code id="trieSuggestOut">—</code></p>
      <pre id="trieView" class="view" aria-live="polite">(empty)</pre>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
