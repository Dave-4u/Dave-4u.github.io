<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rock Paper Scissors · chalkboard edition</title>
  <meta name="description" content="Rock, paper, scissors against the computer, drawn on a chalkboard. A browser port of Dave's C# console game." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2321392c'/%3E%3Ccircle cx='32' cy='34' r='15' fill='none' stroke='%23f7e38a' stroke-width='5'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --board: #21392c; --board-2: #2a4637; --chalk: #f3f1e6; --chalk-2: #c9cfc4; --dim: #8fa397; --yellow: #f7e38a; --pink: #f4a3a8; --blue: #9fd3f0; --wood: #8a5a35;
      --hand: "Kalam", "Comic Sans MS", cursive; --body: "Work Sans", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { font-family: var(--body); background: #17271e; color: var(--chalk); min-height: 100vh; display: flex; flex-direction: column; }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 3px dashed var(--yellow); outline-offset: 4px; border-radius: 12px; }
    .frame { width: min(1000px, 100% - 1.5rem); margin: 1.5rem auto; flex: 1; border: 14px solid var(--wood); border-radius: 18px; background:
      radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.06), transparent 60%), radial-gradient(ellipse at 80% 90%, rgba(255,255,255,.04), transparent 50%), var(--board);
      box-shadow: inset 0 0 60px rgba(0,0,0,.45), 0 20px 50px -20px rgba(0,0,0,.8); padding: clamp(1rem, 4vw, 2.4rem); position: relative; }
    .frame::after { content: ""; position: absolute; left: 10%; right: 10%; bottom: -14px; height: 10px; background: #6d4426; border-radius: 0 0 6px 6px; }
    header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; }
    h1 { font: 700 clamp(2rem, 5vw, 3.2rem)/1 var(--hand); margin: 0; transform: rotate(-1.5deg); }
    h1 span { color: var(--yellow); }
    .sub { color: var(--chalk-2); margin: .4rem 0 0; }
    .mode { display: flex; align-items: center; gap: .6rem; font-size: .92rem; color: var(--chalk-2); }
    .switch { position: relative; width: 48px; height: 28px; border-radius: 999px; border: 2px solid var(--chalk-2); background: transparent; cursor: pointer; }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--chalk-2); transition: transform .25s cubic-bezier(.3,1.5,.5,1), background .2s; }
    .switch[aria-checked="true"] { border-color: var(--yellow); }
    .switch[aria-checked="true"]::after { transform: translateX(20px); background: var(--yellow); }
    .arena { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1rem; margin: 2rem 0 1.4rem; text-align: center; }
    .side h2 { font: 400 1.3rem var(--hand); margin: 0 0 .6rem; color: var(--chalk-2); }
    .hand { width: min(200px, 34vw); aspect-ratio: 1; margin: 0 auto; display: grid; place-items: center; }
    .hand svg { width: 100%; height: 100%; fill: none; stroke: var(--chalk); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; filter: url(#chalky); }
    .hand.cpu svg { transform: scaleX(-1); }
    .hand.shaking svg { animation: pump .32s ease-in-out 3; transform-origin: 50% 80%; }
    .hand.cpu.shaking svg { animation-name: pumpFlip; }
    @keyframes pump { 50% { transform: translateY(-22px) rotate(-8deg); } }
    @keyframes pumpFlip { 0%,100% { transform: scaleX(-1); } 50% { transform: scaleX(-1) translateY(-22px) rotate(-8deg); } }
    .hand.win svg { stroke: var(--yellow); }
    .hand.lose svg { stroke: var(--dim); }
    .vs { font: 700 2rem var(--hand); color: var(--dim); min-width: 5ch; }
    .vs.call { color: var(--yellow); transform: scale(1.15); transition: transform .15s; }
    .verdict { font: 700 clamp(1.6rem, 4vw, 2.4rem) var(--hand); text-align: center; min-height: 1.4em; margin: 0; }
    .verdict.win { color: var(--yellow); } .verdict.lose { color: var(--pink); } .verdict.tie { color: var(--blue); }
    .explain { text-align: center; color: var(--chalk-2); min-height: 1.5em; margin: .2rem 0 1.4rem; }
    .moves { display: flex; justify-content: center; gap: clamp(.6rem, 2vw, 1.2rem); flex-wrap: wrap; }
    .move { display: flex; flex-direction: column; align-items: center; gap: .3rem; width: 132px; padding: .9rem .6rem .7rem; border-radius: 18px; border: 2.5px solid var(--chalk-2); background: rgba(255,255,255,.03); cursor: pointer; transition: transform .15s cubic-bezier(.3,1.6,.5,1), border-color .2s, background .2s; }
    .move svg { width: 64px; height: 64px; fill: none; stroke: currentColor; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .move b { font: 700 1.25rem var(--hand); }
    .move kbd { font: 500 .75rem var(--body); color: var(--dim); border: 1px solid var(--dim); padding: 0 .35rem; border-radius: 4px; }
    .move:hover:not(:disabled) { transform: translateY(-5px) rotate(-2deg); border-color: var(--yellow); color: var(--yellow); }
    .move:active:not(:disabled) { transform: scale(.95); }
    .move:disabled { opacity: .45; cursor: wait; }
    .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-top: 2rem; padding-top: 1.2rem; border-top: 2px dashed rgba(243,241,230,.25); text-align: center; }
    .tally b { display: block; font: 700 2.2rem/1 var(--hand); }
    .tally span { color: var(--chalk-2); font-size: .85rem; }
    .tally.w b { color: var(--yellow); } .tally.l b { color: var(--pink); } .tally.t b { color: var(--blue); }
    .history { display: flex; justify-content: center; gap: .35rem; margin: 1.2rem 0 0; padding: 0; list-style: none; min-height: 18px; flex-wrap: wrap; }
    .history li { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--chalk-2); animation: pop .3s cubic-bezier(.3,1.6,.5,1); }
    .history li.win { background: var(--yellow); border-color: var(--yellow); } .history li.lose { background: var(--pink); border-color: var(--pink); } .history li.tie { background: transparent; border-color: var(--blue); }
    @keyframes pop { from { transform: scale(0); } }
    .tools { display: flex; justify-content: center; gap: 1rem; margin-top: 1rem; }
    .link { background: none; border: 0; color: var(--chalk-2); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: .9rem; }
    .link:hover { color: var(--chalk); }
    footer { text-align: center; color: var(--dim); font-size: .88rem; padding: 0 1rem 1.4rem; }
    footer a { color: var(--chalk-2); }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    @media (max-width: 640px) { .move { width: 30%; } .move svg { width: 48px; height: 48px; } .board { grid-template-columns: repeat(2, 1fr); } .vs { font-size: 1.4rem; min-width: 3ch; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="chalky"><feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.5"/></filter>
    <symbol id="rock" viewBox="0 0 100 100"><path d="M24 58c-6-14 2-30 16-32 6-8 18-8 24-2 10-2 18 6 18 16 6 6 6 18-2 24-6 12-22 16-36 14-10-2-18-8-20-20z"/><path d="M40 26c-2 8 0 14 4 18M60 26c-2 8 0 14 4 18M44 70c6 2 14 2 20-2"/></symbol>
    <symbol id="paper" viewBox="0 0 100 100"><path d="M26 16h36l14 14v54H26z"/><path d="M62 16v14h14M36 44h30M36 56h30M36 68h20"/></symbol>
    <symbol id="scissors" viewBox="0 0 100 100"><circle cx="28" cy="70" r="12"/><circle cx="28" cy="34" r="12"/><path d="M38 64L84 22M38 40l46 42M52 52h0"/></symbol>
    <symbol id="wait" viewBox="0 0 100 100"><path d="M50 22c-14 0-22 8-22 18M50 22c12 0 20 8 20 18 0 12-20 14-20 28M50 82v0"/></symbol>
  </svg>

  <div class="frame">
    <header>
      <div>
        <h1>Rock <span>·</span> Paper <span>·</span> Scissors</h1>
        <p class="sub">You vs. the computer. First move's yours.</p>
      </div>
      <div class="mode">
        <span id="mode-label">Fair play</span>
        <button class="switch" id="smart" role="switch" aria-checked="false" aria-labelledby="mode-label" title="Smart mode: the computer starts reading your habits"></button>
      </div>
    </header>

    <div class="arena" aria-live="polite">
      <div class="side"><h2>You</h2><div class="hand you" id="you"><svg><use href="#rock"/></svg></div></div>
      <div class="vs" id="vs">vs</div>
      <div class="side"><h2>Computer</h2><div class="hand cpu" id="cpu"><svg><use href="#rock"/></svg></div></div>
    </div>

    <p class="verdict" id="verdict">Pick a move.</p>
    <p class="explain" id="explain">Click a button below or press R, P, or S.</p>

    <div class="moves" role="group" aria-label="Your move">
      <button class="move" data-move="rock"><svg aria-hidden="true"><use href="#rock"/></svg><b>Rock</b><kbd>R</kbd></button>
      <button class="move" data-move="paper"><svg aria-hidden="true"><use href="#paper"/></svg><b>Paper</b><kbd>P</kbd></button>
      <button class="move" data-move="scissors"><svg aria-hidden="true"><use href="#scissors"/></svg><b>Scissors</b><kbd>S</kbd></button>
    </div>

    <div class="board">
      <div class="tally w"><b id="wins">0</b><span>wins</span></div>
      <div class="tally l"><b id="losses">0</b><span>losses</span></div>
      <div class="tally t"><b id="ties">0</b><span>ties</span></div>
      <div class="tally"><b id="streak">0</b><span id="streak-label">win streak</span></div>
    </div>
    <ul class="history" id="history" aria-label="Last rounds"></ul>
    <div class="tools"><button class="link" id="reset">Wipe the board</button></div>
  </div>

  <footer>Browser port of <a href="https://github.com/Dave-4u/csharp-rock-paper-scissors">csharp-rock-paper-scissors</a> · by <a href="https://dave-4u.github.io/">Dave Adegboro</a></footer>

  <script>
  (function () {
    "use strict";
    var MOVES = ["rock", "paper", "scissors"];
    var BEATS = { rock: "scissors", paper: "rock", scissors: "paper" };
    var WHY = { "rock>scissors": "Rock crushes scissors.", "paper>rock": "Paper covers rock.", "scissors>paper": "Scissors cut paper." };
    var KEY = "rps-chalk-v1";
    var $ = function (id) { return document.getElementById(id); };
    var s = { wins: 0, losses: 0, ties: 0, streak: 0, best: 0, history: [], counts: { rock: 0, paper: 0, scissors: 0 }, smart: false };
    try { Object.assign(s, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
    var busy = false;
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function save() { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
    function setHand(el, move) { el.querySelector("use").setAttribute("href", "#" + move); }
    function cpuMove() {
      if (s.smart) {
        var total = s.counts.rock + s.counts.paper + s.counts.scissors;
        if (total >= 3 && Math.random() < 0.6) {
          var fav = MOVES.slice().sort(function (a, b) { return s.counts[b] - s.counts[a]; })[0];
          return MOVES.filter(function (m) { return BEATS[m] === fav; })[0];
        }
      }
      return MOVES[Math.floor(Math.random() * 3)];
    }
    function render() {
      $("wins").textContent = s.wins; $("losses").textContent = s.losses; $("ties").textContent = s.ties;
      $("streak").textContent = s.streak; $("streak-label").textContent = "win streak · best " + s.best;
      $("history").innerHTML = s.history.slice(-20).map(function (r) { return '<li class="' + r + '" title="' + r + '"></li>'; }).join("");
      $("smart").setAttribute("aria-checked", s.smart ? "true" : "false");
      $("mode-label").textContent = s.smart ? "Smart mode (it's watching you)" : "Fair play";
    }
    function play(move) {
      if (busy) return;
      busy = true;
      document.querySelectorAll(".move").forEach(function (b) { b.disabled = true; });
      var you = $("you"), cpu = $("cpu"), vs = $("vs");
      [you, cpu].forEach(function (h) { h.classList.remove("win", "lose"); setHand(h, "rock"); h.classList.add("shaking"); });
      $("verdict").className = "verdict"; $("verdict").textContent = "…"; $("explain").textContent = "";
      var words = ["Rock…", "Paper…", "Scissors…"], i = 0;
      vs.textContent = words[0];
      var step = reduce ? 0 : 320;
      var t = setInterval(function () {
        i++;
        if (i < 3) { vs.textContent = words[i]; return; }
        clearInterval(t);
        reveal(move);
      }, step);
    }
    function reveal(move) {
      var you = $("you"), cpu = $("cpu"), vs = $("vs");
      var c = cpuMove();
      s.counts[move]++;
      [you, cpu].forEach(function (h) { h.classList.remove("shaking"); });
      setHand(you, move); setHand(cpu, c);
      vs.textContent = "Shoot!"; vs.classList.add("call");
      setTimeout(function () { vs.classList.remove("call"); vs.textContent = "vs"; }, 600);
      var result = move === c ? "tie" : BEATS[move] === c ? "win" : "lose";
      var v = $("verdict"), ex = $("explain");
      v.className = "verdict " + result;
      if (result === "tie") { s.ties++; v.textContent = "Tie. Great minds."; ex.textContent = "You both threw " + move + "."; }
      else if (result === "win") {
        s.wins++; s.streak++; s.best = Math.max(s.best, s.streak);
        you.classList.add("win"); cpu.classList.add("lose");
        v.textContent = s.streak >= 3 ? s.streak + " in a row. You're on a roll!" : "You win!";
        ex.textContent = WHY[move + ">" + c];
      } else {
        s.losses++; s.streak = 0;
        cpu.classList.add("win"); you.classList.add("lose");
        v.textContent = "Computer wins this one.";
        ex.textContent = WHY[c + ">" + move] + (s.smart ? " It's been studying your favourite move." : "");
      }
      s.history.push(result); if (s.history.length > 50) s.history.shift();
      save(); render();
      document.querySelectorAll(".move").forEach(function (b) { b.disabled = false; });
      busy = false;
    }
    document.querySelectorAll(".move").forEach(function (b) { b.addEventListener("click", function () { play(b.getAttribute("data-move")); }); });
    document.addEventListener("keydown", function (e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      var k = e.key.toLowerCase();
      if (k === "r") play("rock"); else if (k === "p") play("paper"); else if (k === "s") play("scissors");
    });
    $("smart").addEventListener("click", function () { s.smart = !s.smart; save(); render(); });
    $("reset").addEventListener("click", function () {
      var smart = s.smart;
      s = { wins: 0, losses: 0, ties: 0, streak: 0, best: 0, history: [], counts: { rock: 0, paper: 0, scissors: 0 }, smart: smart };
      save(); render();
      $("verdict").className = "verdict"; $("verdict").textContent = "Clean board. Pick a move.";
      $("explain").textContent = "";
    });
    render();
  })();
  </script>
</body>
</html>
